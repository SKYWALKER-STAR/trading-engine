[project]
name = "trading-engine-platform"
version = "0.1.0"
description = "Modular trading engine platform with an initial strategy engine implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
strategy-engine-factor = "trading_engine.app.run_strategy_engine_factor:run"
position-engine = "trading_engine.app.run_position_engine:run"
#strategy-engine-market-tick = "trading_engine.app.run_strategy_engine_factor:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
runtime = [
  "clickhouse-connect>=0.8.0",
  "kafka-python>=2.0.2",
  "redis>=5.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
